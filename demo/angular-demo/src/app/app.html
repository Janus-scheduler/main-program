<div class="app-shell">
  <aside class="app-sidebar">
    <div class="app-sidebar-brand">
      <span class="brand-icon">J</span>
      <span class="brand-name">Janus</span>
    </div>

    <nav class="app-sidebar-nav">
      <button class="nav-item active">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <rect x="3" y="3" width="7" height="7" rx="1" />
          <rect x="14" y="3" width="7" height="7" rx="1" />
          <rect x="3" y="14" width="7" height="7" rx="1" />
          <rect x="14" y="14" width="7" height="7" rx="1" />
        </svg>
        <span>Dashboard</span>
      </button>
      <button class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" />
          <circle cx="9" cy="7" r="4" />
          <path d="M23 21v-2a4 4 0 0 0-3-3.87" />
          <path d="M16 3.13a4 4 0 0 1 0 7.75" />
        </svg>
        <span>People</span>
      </button>
      <button class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="2" />
          <line x1="9" y1="3" x2="9" y2="21" />
        </svg>
        <span>Rooms</span>
      </button>
      <button class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z" />
        </svg>
        <span>Equipment</span>
      </button>
      <button class="nav-item" (click)="syncBulkEvents()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3" />
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" />
        </svg>
        <span>Sync Data</span>
      </button>
    </nav>

    <div class="app-sidebar-footer">
      <span class="footer-version">Janus v3.4</span>
      <span class="footer-status">All systems operational</span>
    </div>
  </aside>

  <main class="app-main" style="display: flex; flex-direction: row; height: 100%; width: 100%;">
    <div style="display: flex; flex-direction: column; flex: 1; min-width: 0; height: 100%;">
      <janus-topbar-ng
      [navLabel]="navData().navLabel"
      [dayName]="navData().dayName"
      [shortDate]="navData().shortDate"
      [view]="currentView"
      [zoomPercent]="navData().zoomPercent"
      [zoomUnit]="navData().zoomUnit"
      [isGoogleCalendarConnected]="googleConnected()"
      (prevClick)="handlePrevClick()"
      (nextClick)="handleNextClick()"
      (todayClick)="handleTodayClick()"
      (viewSwitch)="handleViewChange($event)"
      (toggleCreate)="handleToggleCreate()"
      (connectCalendar)="handleConnectCalendar()"
    />

    @if (currentView === 'Timeline') {
      <janus-timeline-ng
        #timelineEl
        [allowCreate]="allowCreate()"
        [resourceTypeConfig]="TIMELINE_RESOURCE_CONFIG"
        (eventClick)="handleEventClick($event)"
        (addEvent)="handleAddEvent()"
        (eventMove)="handleEventMove($event)"
        (eventResize)="handleEventResize($event)"
        (eventCreate)="handleEventCreate($event)"
        (viewChange)="handleViewChange($event)"
        (navChange)="handleNavChange($event)"
      />
    }

    @if (currentView === 'Month') {
      <janus-month-grid-ng
        #monthGridEl
        [navLinks]="true"
        (addEvent)="handleAddEvent()"
        (eventClick)="handleEventClick($event)"
        (dayHeaderClick)="handleDayHeaderClick($event)"
        (slotSelect)="handleMonthSlotSelect($event)"
        (viewChange)="handleViewChange($event)"
        (navChange)="handleNavChange($event)"
      />
    }

    @if (currentView === 'Week') {
      <janus-week-grid-ng
        #weekGridEl
        [allowCreate]="allowCreate()"
        (addEvent)="handleAddEvent()"
        (eventClick)="handleEventClick($event)"
        (slotSelect)="handleSlotSelect($event)"
        (eventMove)="handleTimeGridMove($event)"
        (eventResize)="handleTimeGridResize($event)"
        (viewChange)="handleViewChange($event)"
        (navChange)="handleNavChange($event)"
      />
    }

    @if (currentView === 'Day') {
      <janus-day-grid-ng
        #dayGridEl
        [allowCreate]="allowCreate()"
        (addEvent)="handleAddEvent()"
        (eventClick)="handleEventClick($event)"
        (slotSelect)="handleSlotSelect($event)"
        (eventMove)="handleTimeGridMove($event)"
        (eventResize)="handleTimeGridResize($event)"
        (viewChange)="handleViewChange($event)"
        (navChange)="handleNavChange($event)"
      />
    }

    @if (currentView === 'Year') {
      <janus-year-grid-ng
        #yearGridEl
        (viewChange)="handleViewChange($event)"
        (dayClick)="handleDayClick($event)"
        (navChange)="handleNavChange($event)"
      />
    }

    @if (showScheduler) {
      <janus-scheduler-ng
        [eventId]="selectedEventId()"
        [title]="modalTitle()"
        [startDate]="startParts().date"
        [startTime]="startParts().time"
        [endDate]="endParts().date"
        [endTime]="endParts().time"
        [participants]="participants()"
        [description]="storeEvent()?.description"
        [activeColor]="activeColor()"
        [allDay]="storeEvent()?.allDay"
        [recurrenceRule]="storeEvent()?.recurrenceRule"
        [showConfirmOnCreate]="!selectedEventId() && !!tempEventData()?.showConfirmOnCreate"
        [error]="schedulerError()"
        (save)="handleSave($event)"
        (delete)="handleDelete($event)"
        (close)="closeScheduler()"
      />
    }
    </div>
    
    <div class="chat-sidebar">
      <div class="chat-sidebar__panel">
        <janus-chat-ng
          [messages]="chatService.thread()"
          [busy]="chatService.busy() || engineService.state().status === 'loading'"
          [disabled]="chatService.busy() || engineService.state().status === 'loading'"
          theme="light"
          [showClose]="true"
          [placeholder]="engineService.state().status === 'ready' ? 'Ask me to schedule something…' : 'Loading the language model…'"
          (chatSubmit)="chatService.submit($event.prompt)"
          (chatClarifyResponse)="chatService.choose($event.label)"
          (chatConfirm)="chatService.confirm()"
          (chatUndo)="chatService.undo($event.messageId)"
          (chatEdit)="chatService.edit()"
        ></janus-chat-ng>
      </div>
    </div>
  </main>
</div>
