sonar.projectKey=Janus-scheduler_main-program
sonar.organization=janus-scheduler
sonar.projectName=Janus Scheduler Core
sonar.projectVersion=1.0.0
sonar.host.url=https://sonarcloud.io

# Source and test paths
sonar.sources=packages/core/src
sonar.tests=packages/core/tests
sonar.test.inclusions=**/*.test.ts
sonar.exclusions=**/node_modules/**,**/dist/**

# Coverage report generated by Jest (lcov format)
sonar.javascript.lcov.reportPaths=packages/core/coverage/lcov.info

# Encoding of the source code
sonar.sourceEncoding=UTF-8

# Exclude initializers and typings from coverage metrics
sonar.coverage.exclusions=packages/core/src/**/*init.ts,packages/core/src/**/*.types.ts,packages/core/src/index.ts
