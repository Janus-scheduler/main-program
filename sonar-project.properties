sonar.projectKey=Janus-scheduler_main-program
sonar.organization=janus-scheduler
sonar.projectName=Janus Scheduler
sonar.projectVersion=1.0.0
sonar.host.url=https://sonarcloud.io

# Source and test paths
sonar.sources=packages/core/src,packages/nlp/src
sonar.tests=packages/core/tests,packages/nlp/tests
sonar.test.inclusions=**/*.test.ts,**/*.spec.ts
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/coverage/**,**/fixtures/**,**/artifacts/**,demo/**,packages/ui/**,packages/wrappers/**,docs/**

# Coverage reports generated by Jest (lcov format)
sonar.javascript.lcov.reportPaths=packages/core/coverage/lcov.info,packages/nlp/coverage/lcov.info

# Encoding of the source code
sonar.sourceEncoding=UTF-8

# Exclude initializers, barrels, and typings from coverage metrics
sonar.coverage.exclusions=packages/core/src/**/*init.ts,packages/core/src/**/*.types.ts,packages/core/src/index.ts,packages/nlp/src/types.ts,packages/nlp/src/index.ts,packages/nlp/src/node.ts

# Exclude tests, types, and constants from Duplication (CPD) checks
sonar.cpd.exclusions=**/*.test.ts,**/*.spec.ts,**/types.ts,**/*.types.ts,**/constants.ts,**/fixtures/**,**/artifacts/**
