name: Build
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  sonarqube:
    name: SonarQube
    runs-on: ubuntu-latest # linux is faster and cheaper than windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history required for SonarCloud blame/new-code detection

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Install all workspace dependencies (core, ui, wrappers, demos)
      - name: Install dependencies
        run: npm ci

      # Run Jest with --coverage to produce packages/core/coverage/lcov.info & packages/nlp/coverage/lcov.info
      # These files are referenced in sonar-project.properties reportPaths.
      - name: Run tests with coverage
        run: |
          npm test --workspace=packages/core
          npm test --workspace=@janus-scheduler/nlp

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
