name: Build
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  sonarqube:
    name: SonarQube
    runs-on: ubuntu-latest # linux is faster and cheaper than windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history required for SonarCloud blame/new-code detection

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Install all workspace dependencies (core, ui, wrappers, demos)
      - name: Install dependencies
        run: npm ci

      # Build EVERY publishable package. This previously ran `build:packages`,
      # which covers only core, nlp and ui — the wrappers and integrations were
      # never built in CI, so a broken wrapper build could reach main.
      - name: Build packages
        run: npm run build:all

      # Run Jest with --coverage to produce packages/core/coverage/lcov.info & packages/nlp/coverage/lcov.info
      # These files are referenced in sonar-project.properties reportPaths.
      - name: Run tests with coverage
        run: |
          npm test --workspace=packages/core
          npm test --workspace=@janus-scheduler/nlp

      # Catches malformed package.json exports/main/types before publish.
      - name: Lint package manifests
        run: npm run check:packages

      # Installs the real tarballs into a throwaway app OUTSIDE the workspace.
      # Every demo aliases @janus-scheduler/* back to src, so this is the only
      # check that exercises the packages the way an npm consumer does.
      - name: Smoke-test published artifacts
        run: npm run test:pack

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
